async function ensureCameraPermission(){
  // Already decided this session
  if(sessionStorage.getItem("bg_cam_ok")==="1") return true;
  if(sessionStorage.getItem("bg_cam_skip")==="1") return false;
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    // Cannot request — continue without blocking
    return false;
  }
  // Check Permissions API if available
  try{
    if(navigator.permissions && navigator.permissions.query){
      const st = await navigator.permissions.query({name:"camera"});
      if(st.state==="granted"){ sessionStorage.setItem("bg_cam_ok","1"); return true; }
      if(st.state==="denied"){ /* still show gate so user can open settings */ }
    }
  }catch(e){}
  return new Promise(resolve=>{
    let w=$("#camGate");
    if(!w){w=document.createElement("div");w.id="camGate";w.className="modal-wrap lock";document.body.appendChild(w)}
    w.hidden=false;
    w.innerHTML=`<section class="modal" style="max-width:420px;text-align:center">
      <div style="font-size:48px;margin-bottom:8px">📷</div>
      <h2 style="margin:0 0 10px">Autorisation caméra</h2>
      <p class="hint" style="margin-bottom:16px">BoutiqueGest a besoin de la <b>caméra</b> pour scanner les codes-barres en caisse et lors de l'ajout de produits.<br><br>Autorisez l'accès <b>avant</b> de continuer. Vous pourrez le modifier plus tard dans les paramètres du navigateur / de l'application.</p>
      <p class="hint" id="camGateStatus" style="margin-bottom:14px;min-height:1.2em"></p>
      <button class="btn primary" id="camGrantBtn" style="width:100%;margin-bottom:8px">Autoriser la caméra</button>
      <button class="btn light" id="camSkipBtn" style="width:100%">Continuer sans caméra</button>
    </section>`;
    const status=$("#camGateStatus"), grant=$("#camGrantBtn"), skip=$("#camSkipBtn");
    const finish=(ok)=>{
      w.hidden=true;
      if(ok) sessionStorage.setItem("bg_cam_ok","1");
      else sessionStorage.setItem("bg_cam_skip","1");
      resolve(ok);
    };
    skip.onclick=()=>finish(false);
    grant.onclick=async()=>{
      grant.disabled=true; skip.disabled=true;
      status.textContent="Demande d'autorisation en cours…";
      let stream=null;
      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
        // Stop tracks immediately — we only needed the permission prompt
        stream.getTracks().forEach(t=>t.stop());
        status.textContent="Caméra autorisée ✓";
        setTimeout(()=>finish(true),400);
      }catch(err){
        console.warn("Permission caméra:",err);
        const msg=(err&&err.name==="NotAllowedError")?"Autorisation refusée. Autorisez la caméra dans les paramètres de l'application puis réessayez.":
                   (err&&err.message)?err.message:"Impossible d'accéder à la caméra.";
        status.textContent=msg;
        status.style.color="var(--red)";
        grant.disabled=false; skip.disabled=false;
        grant.textContent="Réessayer";
      }
    };
  });
}
async function boot(){
  try{ await ensureCameraPermission(); }catch(e){ console.warn(e); }
  proceedBoot();

function stock(m){m.innerHTML=`${head("Gestion du stock","Surveillez les quantités et les seuils d'alerte.",`<button class="btn primary" onclick="stockAdjust()">＋ Entrée / sortie stock</button>`)}<div class="summary-row"><div class="summary-chip">Références <b>${db.products.length}</b></div><div class="summary-chip">Unités en stock <b>${db.products.reduce((a,p)=>a+p.stock,0)}</b></div><div class="summary-chip">Alertes <b>${db.products.filter(p=>p.stock<=p.threshold).length}</b></div></div><section class="panel" style="margin-top:16px"><div class="table-wrap"><table class="data-table"><tr><th>Produit</th><th>Quantité</th><th>Seuil alerte</th><th>Coût unitaire</th><th>Valeur stock</th><th>État</th><th></th></tr>${db.products.map(p=>`<tr><td>${p.emoji||"📦"} ${esc(p.name)}</td><td><b>${p.stock}</b></td><td>${p.threshold}</td><td>${fmt(p.cost)}</td><td>${fmt(p.stock*p.cost)}</td><td><span class="pill ${p.stock<=p.threshold?'red':''}">${p.stock<=p.threshold?'À réapprovisionner':'Disponible'}</span></td><td><button class="mini" onclick="stockAdjust(${p.id})">Ajuster</button></td></tr>`).join("")}</table></div></section>`}
function customers(m){m.innerHTML=`${head("Clients","Répertoire des clients de la boutique.",`<button class="btn primary" onclick="openCustomer()">＋ Nouveau client</button>`)}<section class="panel"><div class="table-wrap"><table class="data-table"><tr><th>Nom</th><th>Téléphone</th><th>Notes</th><th>Achats</th><th></th></tr>${db.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.notes)}</td><td>${db.sales.filter(s=>s.customer===c.name).length}</td><td><button class="mini" onclick="editCustomer(${c.id})">Modifier</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">Aucun client enregistré.</td></tr>`}</table></div></section>`}
function debts(m){let remaining=db.debts.reduce((a,d)=>a+d.remaining,0);m.innerHTML=`${head("Gestion des dettes","Enregistrez les crédits clients et les remboursements.",`<button class="btn primary" onclick="openDebt()">＋ Ajouter une dette</button>`)}<div class="stats-grid">${stat("TOTAL À RECOUVRER",fmt(remaining),"◷","Toutes les créances")}${stat("DOSSIERS",db.debts.length,"♙","Dettes enregistrées")}${stat("REMBOURSEMENTS",fmt(db.debts.reduce((a,d)=>a+d.paid,0)),"✓","Montants déjà reçus")}</div><section class="panel"><div class="table-wrap"><table class="data-table"><tr><th>Client</th><th>Date</th><th>Montant initial</th><th>Payé</th><th>Reste</th><th>État</th><th></th></tr>${db.debts.map(d=>`<tr><td>${esc(d.customer)}</td><td>${d.date}</td><td>${fmt(d.total)}</td><td>${fmt(d.paid)}</td><td><b>${fmt(d.remaining)}</b></td><td><span class="pill ${d.remaining?'warn':''}">${d.remaining?'En attente':'Soldée'}</span></td><td>${d.remaining?`<button class="mini" onclick="repay(${d.id})">Rembourser</button>`:"—"}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">Aucune dette.</td></tr>`}</table></div></section>`}
function history(m){m.innerHTML=`${head("Historique des ventes","Consultez et réimprimez vos tickets.")}<div class="toolbar"><input type="date" class="field" id="histDate" value=""><input class="field" id="histSearch" placeholder="Référence ou client"></div><section class="panel" id="salesList">${salesTable(db.sales.slice().reverse())}</section>`;function f(){let q=$("#histSearch").value.toLowerCase(),d=$("#histDate").value;$("#salesList").innerHTML=salesTable(db.sales.filter(s=>(!d||s.date===d)&&(!q||String(s.id).includes(q)||(s.customer||"").toLowerCase().includes(q))).reverse())}$("#histDate").onchange=f;$("#histSearch").oninput=f}
function reports(m){let rev=db.sales.reduce((a,s)=>a+s.total,0),profit=db.sales.reduce((a,s)=>a+s.profit,0),cost=db.sales.reduce((a,s)=>a+s.items.reduce((z,i)=>z+i.cost*i.qty,0),0);let by={};db.sales.forEach(s=>by[s.date]=(by[s.date]||0)+s.total);m.innerHTML=`${head("Rapports & statistiques","Analysez les ventes et la rentabilité de votre boutique.",`<button class="btn primary" onclick="exportCSV()">⇩ Exporter CSV</button>`)}<div class="stats-grid">${stat("CHIFFRE D'AFFAIRES",fmt(rev),"↗",db.sales.length+" ventes")}${stat("BÉNÉFICE BRUT ESTIMÉ",pv(profit),"◈","Ventes moins coût produit")}${stat("COÛT DES PRODUITS",pv(cost),"▥","Coût d'achat estimé")}${stat("PANIER MOYEN",fmt(db.sales.length?rev/db.sales.length:0),"◎","Par transaction")}</div><section class="panel"><div class="panel-head"><h3>Ventes par jour</h3></div><div class="table-wrap"><table class="data-table"><tr><th>Date</th><th>Nombre de ventes</th><th>Chiffre d'affaires</th></tr>${Object.keys(by).sort().reverse().map(d=>`<tr><td>${d}</td><td>${db.sales.filter(s=>s.date===d).length}</td><td><b>${fmt(by[d])}</b></td></tr>`).join("")||`<tr><td colspan="3" class="empty">Pas encore de données.</td></tr>`}</table></div></section><p class="hint">Les bénéfices sont des estimations basées sur le coût unitaire saisi pour chaque produit. Les charges fixes, salaires, taxes et pertes ne sont pas inclus.</p>`}
function modal(title,body,submitText,fn){$("#modalContent").innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions"><button class="btn light" onclick="closeModal()">Annuler</button><button class="btn primary" id="modalSubmit">${submitText}</button></div>`;$("#modalWrap").hidden=false;$("#modalSubmit").onclick=fn}
function closeModal(){$("#modalWrap").hidden=true}
function openProduct(id){let p=db.products.find(x=>x.id===id)||{name:"",category:"Alimentaire",price:0,cost:0,stock:0,threshold:db.settings.defThreshold,emoji:"📦",barcode:"",supplierId:null};
modal(id?"Modifier le produit":"Ajouter un produit",`<div class="form-grid">
<div class="form-group full"><label>Nom du produit</label><input id="pName" value="${esc(p.name)}"></div>
<div class="form-group"><label>Catégorie</label><input id="pCat" value="${esc(p.category)}"></div>
<div class="form-group"><label>Emoji / icône</label><input id="pEmoji" value="${esc(p.emoji||"📦")}"></div>
<div class="form-group full"><label>Code-barres</label><div style="display:flex;gap:8px"><input id="pBarcode" value="${esc(p.barcode||"")}" placeholder="Scannez ou saisissez" style="flex:1"><button type="button" class="btn light" onclick="startScan('product')">📷 Scanner</button></div></div>
${supplierSelect(p.supplierId)}
<div class="form-group"><label>Prix de vente (${cur()})</label><input id="pPrice" type="number" min="0" value="${p.price}"></div>
<div class="form-group"><label>Coût d'achat (${cur()})</label><input id="pCost" type="number" min="0" value="${p.cost}"></div>
<div class="form-group"><label>Stock actuel</label><input id="pStock" type="number" min="0" value="${p.stock}"></div>
<div class="form-group"><label>Seuil d'alerte</label><input id="pThreshold" type="number" min="0" value="${p.threshold}"></div>
</div>`,`Enregistrer`,()=>{
let x={id:p.id||Date.now(),name:$("#pName").value.trim(),category:$("#pCat").value.trim()||"Autres",emoji:$("#pEmoji").value||"📦",barcode:($("#pBarcode").value||"").trim(),supplierId:$("#pSupplier").value?+$("#pSupplier").value:null,price:+$("#pPrice").value,cost:+$("#pCost").value,stock:+$("#pStock").value,threshold:+$("#pThreshold").value};
if(!x.name){toast("Saisissez le nom.");return}
if(x.barcode&&db.products.some(z=>z.id!==x.id&&z.barcode===x.barcode)){toast("Ce code-barres est déjà utilisé.");return}
let i=db.products.findIndex(z=>z.id===x.id);
if(i>=0)db.products[i]=x;else db.products.push(x);
closeModal();render();toast("Produit enregistré.");
})}
function deleteProduct(id){if(!can("delete"))return toast("Action non autorisée.");if(confirm("Supprimer ce produit ?")){db.products=db.products.filter(p=>p.id!==id);render()}}
function stockAdjust(id){let p=db.products.find(x=>x.id===id)||db.products[0];if(!p)return;modal("Ajuster le stock",`<p class="hint">${esc(p.name)} · Stock actuel : ${p.stock}</p><div class="form-group"><label>Type de mouvement</label><select id="adjType"><option value="in">Entrée (approvisionnement)</option><option value="out">Sortie / perte</option><option value="set">Définir une quantité exacte</option></select></div><div class="form-group" style="margin-top:12px"><label>Quantité</label><input id="adjQty" type="number" min="0" value="1"></div>`,`Valider`,()=>{let n=+$("#adjQty").value,t=$("#adjType").value;if(n<0)return;p.stock=t==="in"?p.stock+n:t==="out"?Math.max(0,p.stock-n):n;save();closeModal();render();toast("Stock mis à jour.")})}
function openCustomer(id){let c=db.customers.find(x=>x.id===id)||{name:"",phone:"",notes:""};modal(id?"Modifier le client":"Nouveau client",`<div class="form-group"><label>Nom</label><input id="cName" value="${esc(c.name)}"></div><div class="form-group" style="margin-top:12px"><label>Téléphone</label><input id="cPhone" value="${esc(c.phone)}"></div><div class="form-group" style="margin-top:12px"><label>Notes</label><textarea id="cNotes" class="field" style="width:100%">${esc(c.notes)}</textarea></div>`,"Enregistrer",()=>{if(!$("#cName").value.trim())return;let x={id:c.id||Date.now(),name:$("#cName").value.trim(),phone:$("#cPhone").value,notes:$("#cNotes").value};let i=db.customers.findIndex(y=>y.id===x.id);if(i>=0)db.customers[i]=x;else db.customers.push(x);closeModal();render()})}
function editCustomer(id){openCustomer(id)}
function openDebt(){modal("Ajouter une dette",`<div class="form-grid"><div class="form-group"><label>Nom du client</label><input id="dName"></div><div class="form-group"><label>Téléphone</label><input id="dPhone"></div><div class="form-group"><label>Montant total (${cur()})</label><input id="dTotal" type="number" min="1"></div><div class="form-group"><label>Déjà payé (${cur()})</label><input id="dPaid" type="number" min="0" value="0"></div></div>`,"Enregistrer",()=>{let total=+$("#dTotal").value,paid=+$("#dPaid").value;if(!$("#dName").value.trim()||total<=0||paid>total){toast("Vérifiez les informations.");return}db.debts.push({id:Date.now(),customer:$("#dName").value.trim(),phone:$("#dPhone").value,total,paid,remaining:total-paid,date:today()});closeModal();render()})}
function repay(id){let d=db.debts.find(x=>x.id===id);modal("Enregistrer un remboursement",`<p class="hint">Client : ${esc(d.customer)} · Reste : ${fmt(d.remaining)}</p><div class="form-group"><label>Montant reçu (${cur()})</label><input id="repayAmount" type="number" min="1" max="${d.remaining}"></div>`,"Valider",()=>{let n=+$("#repayAmount").value;if(n<=0||n>d.remaining){toast("Montant incorrect.");return}d.paid+=n;d.remaining-=n;closeModal();render();toast("Remboursement enregistré.")})}



function supply(m){
  if(!db.supplyOrders)db.supplyOrders=[];
  if(!db.suppliers)db.suppliers=[];
  let low=db.products.filter(p=>p.stock<=p.threshold);
  let pending=db.supplyOrders.filter(o=>o.status==="pending");
  let received=db.supplyOrders.filter(o=>o.status==="received").slice(-10).reverse();
  m.innerHTML=`${head("Approvisionnement","Fournisseurs, bons de commande et réception de stock.",
    `<div class="toolbar" style="flex-wrap:wrap">
      <button class="btn primary" onclick="openSupplier()">＋ Fournisseur</button>
      <button class="btn accent" onclick="createSupplyOrder()">＋ Nouveau bon d'approvisionnement</button>
    </div>`)}
  <div class="stats-grid">
    ${stat("PRODUITS À RÉAPPRO",low.length,"⚠",low.filter(p=>p.stock<=0).length+" en rupture totale")}
    ${stat("BONS EN ATTENTE",pending.length,"📋","À recevoir")}
    ${stat("FOURNISSEURS",db.suppliers.length,"🚚","Enregistrés")}
  </div>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><h3>⚠ Produits en rupture / stock bas</h3>
      <span class="pill ${low.length?'warn':''}">${low.length}</span>
    </div>
    ${low.length?`<div class="table-wrap"><table class="data-table">
      <tr><th>Produit</th><th>Stock</th><th>Seuil</th><th>Fournisseur</th><th></th></tr>
      ${low.map(p=>{
        let s=db.suppliers.find(x=>x.id===p.supplierId);
        return `<tr>
          <td>${p.emoji||"📦"} <b>${esc(p.name)}</b></td>
          <td class="low-stock">${p.stock}</td>
          <td>${p.threshold}</td>
          <td>${s?esc(s.name):'<span class="pill red">Non assigné</span>'}</td>
          <td><button class="mini" onclick="assignSupplier(${p.id})">${s?"Changer":"Lier fournisseur"}</button></td>
        </tr>`;
      }).join("")}
    </table></div>
    <p class="hint" style="margin-top:10px">Liez chaque produit à un fournisseur, puis créez un bon d'approvisionnement.</p>`
    :`<p class="empty">Aucun produit sous le seuil.</p>`}
  </section>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><h3>📋 Bons d'approvisionnement en attente</h3></div>
    ${pending.length?`<div class="table-wrap"><table class="data-table">
      <tr><th>N°</th><th>Date</th><th>Fournisseur</th><th>Articles</th><th></th></tr>
      ${pending.map(o=>{
        let s=db.suppliers.find(x=>x.id===o.supplierId);
        return `<tr>
          <td>#${o.id}</td>
          <td>${o.date}</td>
          <td><b>${s?esc(s.name):"?"}</b></td>
          <td>${o.items.length} produit(s)</td>
          <td>
            <button class="mini" onclick="viewSupplyOrder(${o.id})">Voir / Imprimer</button>
            <button class="mini accent" onclick="receiveSupplyOrder(${o.id})">✓ Réceptionné</button>
            <button class="mini" onclick="cancelSupplyOrder(${o.id})">Annuler</button>
          </td>
        </tr>`;
      }).join("")}
    </table></div>`:`<p class="empty">Aucun bon en attente.</p>`}
  </section>

  <section class="panel" style="margin-top:16px">
    <div class="panel-head"><h3>🚚 Fournisseurs</h3></div>
    <div class="table-wrap"><table class="data-table">
      <tr><th>Nom</th><th>Téléphone</th><th>Adresse</th><th>Notes</th><th>Produits</th><th></th></tr>
      ${db.suppliers.map(s=>`<tr>
        <td><b>${esc(s.name)}</b></td>
        <td>${esc(s.phone)}</td>
        <td>${esc(s.address)}</td>
        <td>${esc(s.notes)}</td>
        <td>${db.products.filter(p=>p.supplierId===s.id).length}</td>
        <td>
          <button class="mini" onclick="openSupplier(${s.id})">Modifier</button>
          <button class="mini" onclick="delSupplier(${s.id})">Suppr.</button>
        </td>
      </tr>`).join("")||`<tr><td colspan="6" class="empty">Aucun fournisseur.</td></tr>`}
    </table></div>
  </section>

  ${received.length?`<section class="panel" style="margin-top:16px">
    <div class="panel-head"><h3>Historique des réceptions (10 derniers)</h3></div>
    <div class="table-wrap"><table class="data-table">
      <tr><th>N°</th><th>Date commande</th><th>Réception</th><th>Fournisseur</th><th>Articles</th><th></th></tr>
      ${received.map(o=>{
        let s=db.suppliers.find(x=>x.id===o.supplierId);
        return `<tr>
          <td>#${o.id}</td>
          <td>${o.date}</td>
          <td>${o.receivedAt||"—"}</td>
          <td>${s?esc(s.name):"?"}</td>
          <td>${o.items.length}</td>
          <td><button class="mini" onclick="viewSupplyOrder(${o.id})">Voir</button></td>
        </tr>`;
      }).join("")}
    </table></div>
  </section>`:""}`;
}

function openSupplier(id){
  let s=(db.suppliers||[]).find(x=>x.id===id)||{name:"",phone:"",address:"",notes:""};
  modal(id?"Modifier le fournisseur":"Nouveau fournisseur",
    `<div class="form-grid">
      <div class="form-group full"><label>Nom du fournisseur</label><input id="supName" value="${esc(s.name)}"></div>
      <div class="form-group"><label>Téléphone</label><input id="supPhone" value="${esc(s.phone)}"></div>
      <div class="form-group"><label>Adresse</label><input id="supAddr" value="${esc(s.address)}"></div>
      <div class="form-group full"><label>Notes</label><textarea id="supNotes" class="field" style="width:100%">${esc(s.notes)}</textarea></div>
    </div>`,
    "Enregistrer",()=>{
      let name=$("#supName").value.trim();
      if(!name)return toast("Saisissez le nom du fournisseur.");
      let x={id:s.id||Date.now(),name,phone:$("#supPhone").value.trim(),address:$("#supAddr").value.trim(),notes:$("#supNotes").value.trim()};
      if(!db.suppliers)db.suppliers=[];
      let i=db.suppliers.findIndex(y=>y.id===x.id);
      if(i>=0)db.suppliers[i]=x;else db.suppliers.push(x);
      save();closeModal();render();toast("Fournisseur enregistré.");
    });
}

function delSupplier(id){
  if(!confirm("Supprimer ce fournisseur ? Les produits liés resteront sans fournisseur."))return;
  db.suppliers=(db.suppliers||[]).filter(s=>s.id!==id);
  db.products.forEach(p=>{if(p.supplierId===id)p.supplierId=null});
  save();render();
}

function supplierSelect(selected){
  let opts=`<option value="">— Aucun —</option>`+(db.suppliers||[]).map(s=>`<option value="${s.id}" ${s.id==selected?"selected":""}>${esc(s.name)}</option>`).join("");
  return `<div class="form-group"><label>Fournisseur</label><select id="pSupplier">${opts}</select></div>`;
}

function assignSupplier(productId){
  let p=db.products.find(x=>x.id===productId);
  if(!p)return;
  let sups=db.suppliers||[];
  if(!sups.length){
    if(confirm("Aucun fournisseur. Créer un fournisseur maintenant ?"))openSupplier();
    return;
  }
  modal("Lier un fournisseur",
    `<p class="hint">Produit : <b>${esc(p.name)}</b> (stock ${p.stock})</p>
     <div class="form-group"><label>Fournisseur</label>
     <select id="asSup">${sups.map(s=>`<option value="${s.id}" ${p.supplierId===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
     </div>`,
    "Enregistrer",()=>{
      p.supplierId=+$("#asSup").value;
      save();closeModal();render();toast("Fournisseur lié.");
    });
}

function createSupplyOrder(){
  let sups=db.suppliers||[];
  if(!sups.length){
    if(confirm("Aucun fournisseur. Créer un fournisseur d'abord ?"))openSupplier();
    return;
  }
  // Step 1: choose supplier
  modal("Nouveau bon d'approvisionnement",
    `<p class="hint">Choisissez le fournisseur. Les produits en rupture liés à ce fournisseur seront proposés ; vous pourrez régler les quantités.</p>
     <div class="form-group"><label>Fournisseur</label>
     <select id="soSup">${sups.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
     </div>
     <label class="tog"><input type="checkbox" id="soOnlyLow" checked> Uniquement les produits en rupture / stock bas</label>`,
    "Continuer",()=>{
      let sid=+$("#soSup").value;
      let onlyLow=$("#soOnlyLow").checked;
      let products=db.products.filter(p=>p.supplierId===sid && (!onlyLow || p.stock<=p.threshold));
      if(!products.length){
        toast(onlyLow?"Aucun produit en rupture pour ce fournisseur.":"Aucun produit lié à ce fournisseur.");
        return;
      }
      closeModal();
      setTimeout(()=>editSupplyOrderItems(sid, products), 150);
    });
}

function editSupplyOrderItems(supplierId, products){
  let s=db.suppliers.find(x=>x.id===supplierId);
  let rows=products.map(p=>{
    let suggested=Math.max(p.threshold*2-p.stock, p.threshold||5, 1);
    return `<tr>
      <td>${p.emoji||"📦"} ${esc(p.name)}<br><small>Stock actuel : ${p.stock} · Seuil : ${p.threshold}</small></td>
      <td><input class="field soQty" data-id="${p.id}" type="number" min="0" value="${suggested}" style="width:90px"></td>
    </tr>`;
  }).join("");
  modal("Quantités à commander — "+(s?s.name:""),
    `<p class="hint">Modifiez les quantités. Mettez 0 pour ne pas commander un produit.</p>
     <div class="table-wrap"><table class="data-table">
       <tr><th>Produit</th><th>Quantité à commander</th></tr>
       ${rows}
     </table></div>`,
    "Créer le bon",()=>{
      let items=[];
      document.querySelectorAll(".soQty").forEach(inp=>{
        let qty=+inp.value||0;
        if(qty<=0)return;
        let p=db.products.find(x=>x.id===+inp.dataset.id);
        if(p)items.push({productId:p.id,name:p.name,qty,barcode:p.barcode||""});
      });
      if(!items.length)return toast("Indiquez au moins une quantité > 0.");
      if(!db.supplyOrders)db.supplyOrders=[];
      let order={id:Date.now(),supplierId,date:today(),status:"pending",items,createdAt:new Date().toISOString()};
      db.supplyOrders.push(order);
      save();closeModal();render();
      toast("Bon créé. Vous pouvez l'imprimer puis valider la réception plus tard.");
      setTimeout(()=>viewSupplyOrder(order.id), 200);
    });
}

function viewSupplyOrder(id){

const chatTopic=dev=>`rgchat-${dev}`;
const chatKey=dev=>`rg_chat_${dev}`;
function chatStore(dev){try{return JSON.parse(LS[chatKey(dev)]||"[]")}catch(e){return []}}
function chatSave(dev,msgs){LS[chatKey(dev)]=JSON.stringify(msgs.slice(-200))}
function parseChatMsg(raw){
  // Format: CHAT|from|name|text  (from = owner|partner)
  if(!String(raw||"").startsWith("CHAT|"))return null;
  let p=String(raw).split("|");
  if(p.length<4)return null;
  return {from:p[1],name:p[2],text:p.slice(3).join("|")};
}
async function pullChat(dev){
  try{
    const r=await fetch(`${BILLING.ntfy}/${chatTopic(dev)}/json?poll=1&since=all`,{cache:"no-store"});
    if(!r.ok)return chatStore(dev);
    const raw=await r.text();
    const events=raw.trim().split(/\r?\n/).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    let local=chatStore(dev);
    let known=new Set(local.map(m=>m.id));
    let added=0;
    events.filter(e=>e.event==="message").forEach(e=>{
      const m=parseChatMsg(e.message);
      if(!m||known.has(e.id))return;
      local.push({id:e.id,time:e.time,from:m.from,name:m.name,text:m.text});
      known.add(e.id);added++;
    });
    local.sort((a,b)=>a.time-b.time);
    chatSave(dev,local);
    return {msgs:local,added};
  }catch(e){return {msgs:chatStore(dev),added:0}}
}
async function sendChat(dev,text,asOwner){
  text=(text||"").trim();
  if(!text)return toast("Écrivez un message.");
  if(text.length>500)return toast("Message trop long (500 car. max).");
  const from=asOwner?"owner":"partner";
  const name=asOwner?(curUser().name||"Propriétaire"):(db.settings.name||curUser().name||"Partenaire");
  const body=`CHAT|${from}|${ascii(name)}|${ascii(text)}`;
  try{
    const r=await fetch(`${BILLING.ntfy}/${chatTopic(dev)}`,{method:"POST",headers:{Title:asOwner?("Message support — "+name):("Message partenaire — "+name),Tags:"speech_balloon",Priority:"default"},body});
    if(!r.ok)throw 0;
    // optimistic local
    let local=chatStore(dev);
    local.push({id:"local-"+Date.now(),time:Math.floor(Date.now()/1000),from,name,text});
    chatSave(dev,local);
    return true;
  }catch(e){toast("Envoi impossible. Vérifiez Internet.");return false}
}

function applyCfg(c){if(c.cur)BILLING.cur=String(c.cur);if(typeof c.wa==="string")BILLING.wa=c.wa;if(Array.isArray(c.plans)&&c.plans.length)BILLING.plans=c.plans.map(p=>[+p[0],String(p[1]),+p[2]]);if(Array.isArray(c.pay)&&c.pay.length)BILLING.pay=c.pay.map(p=>({name:String(p.name),num:String(p.num),holder:String(p.holder||""),url:/^https?:\/\//i.test(p.url||"")?p.url:""}));CFGV=c.v||0}
async function loadCfg(){try{if(LS.rg_cfg){let c=await readCfg(LS.rg_cfg);if(c&&c.v>CFGV)applyCfg(c)}
let t=await(await fetch(cfgUrl()+"/json?poll=1&since=all")).text(),best=null;for(let l of t.trim().split("\n").filter(Boolean)){let e=JSON.parse(l);if(e.event!=="message"||!String(e.message).startsWith("RGC1."))continue;let c=await readCfg(e.message);if(c&&c.v>(best?best.c.v:CFGV))best={c,raw:e.message}}if(best){applyCfg(best.c);LS.rg_cfg=best.raw}}catch(e){}}
function cfgDraw(){let b=$("#cfgBox");if(b)b.innerHTML=cfgHtml()}
function cfgHtml(){if(!DRAFT)DRAFT=JSON.parse(JSON.stringify({cur:BILLING.cur,wa:BILLING.wa,plans:BILLING.plans,pay:BILLING.pay,sup:BILLING.sup||[]}));let d=DRAFT;
return `<div class="form-grid">${inp("cfCur","Devise",d.cur,"text",'oninput="DRAFT.cur=this.value"')}</div>
<h4 style="margin:18px 0 8px;font-size:12px">Formules d'abonnement (durée en mois · prix)</h4>${d.plans.map((p,i)=>`<div class="mrow"><input class="field" type="number" min="1" value="${p[0]}" placeholder="Mois" oninput="DRAFT.plans[${i}][0]=+this.value" style="max-width:90px"><input class="field" type="number" min="0" value="${p[2]}" placeholder="Prix" oninput="DRAFT.plans[${i}][2]=+this.value"><button class="mini" onclick="DRAFT.plans.splice(${i},1);cfgDraw()">✕</button></div>`).join("")}<button class="btn light" onclick="DRAFT.plans.push([1,'',0]);cfgDraw()">＋ Formule</button>
<h4 style="margin:18px 0 8px;font-size:12px">Moyens de paiement</h4>${d.pay.map((p,i)=>`<div class="panel" style="padding:12px;margin-bottom:10px"><div class="mrow"><input class="field" placeholder="Nom du moyen de paiement" value="${esc(p.name)}" oninput="DRAFT.pay[${i}].name=this.value"><button class="mini" onclick="DRAFT.pay.splice(${i},1);cfgDraw()">Supprimer</button></div><div class="mrow"><input class="field" placeholder="Numéro / compte" value="${esc(p.num)}" oninput="DRAFT.pay[${i}].num=this.value"></div><div class="mrow"><input class="field" placeholder="Nom du titulaire" value="${esc(p.holder)}" oninput="DRAFT.pay[${i}].holder=this.value"></div><div class="mrow"><input class="field" placeholder="Lien de paiement (facultatif)" value="${esc(p.url)}" oninput="DRAFT.pay[${i}].url=this.value"></div></div>`).join("")}<button class="btn light" onclick="DRAFT.pay.push({name:'',num:'',holder:'',url:''});cfgDraw()">＋ Moyen de paiement</button>${supCfgHtml(d)}
<div style="margin-top:16px"><button class="btn primary" onclick="publishCfg()">Publier les modifications</button></div><p class="hint">Les clients reçoivent les nouveaux tarifs automatiquement à leur prochaine connexion. ${LS.rg_cfgpub?"Dernière publication : "+new Date(+LS.rg_cfgpub).toLocaleString("fr-FR"):"Pas encore publié : les clients utilisent les valeurs d'origine du fichier."}</p>`}
async function publishCfg(){let d=DRAFT;if(!d)return;let plans=d.plans.filter(p=>+p[0]>0&&+p[2]>0).map(p=>[+p[0],+p[0]===1?"1 mois":(+p[0])+" mois",+p[2]]),pay=d.pay.filter(p=>String(p.name).trim()&&String(p.num).trim()).map(p=>({name:p.name.trim(),num:p.num.trim(),holder:String(p.holder||"").trim(),url:String(p.url||"").trim()}));
if(!plans.length||!pay.length)return toast("Ajoutez au moins une formule (durée et prix) et un moyen de paiement.");
let c={v:Date.now(),cur:String(d.cur||"FCFA").trim(),wa:"",sup:(d.sup||[]).filter(x=>String(x.value||"").trim()).map(x=>({type:String(x.type||"link"),label:String(x.label||"").trim(),value:String(x.value).trim()})),plans,pay};
try{let pk=await crypto.subtle.importKey("jwk",JSON.parse(LS.rg_owner_priv),ECD,false,["sign"]),pb=TE.encode(JSON.stringify(c)),s=await crypto.subtle.sign(ECH,pk,pb),msg="RGC1."+b64u(pb)+"."+b64u(s);if(msg.length>3800)return toast("Configuration trop longue : réduisez le nombre d'éléments.");
let r=await fetch(cfgUrl(),{method:"POST",headers:{Title:"Config BoutiqueGest"},body:msg});if(!r.ok)throw new Error("HTTP "+r.status);LS.rg_cfg=msg;LS.rg_cfgpub=Date.now();applyCfg(c);DRAFT=null;render();toast("Tarifs et paiements publiés ✓")}catch(e){toast("Publication impossible ("+((e&&e.message)||"réseau")+"). Vérifiez Internet.")}}
async function reCfg(){try{if(LS.rg_owner_priv&&LS.rg_cfg&&Date.now()-(+LS.rg_cfgpub||0)>6*36e5){let r=await fetch(cfgUrl(),{method:"POST",headers:{Title:"Config BoutiqueGest"},body:LS.rg_cfg});if(r.ok)LS.rg_cfgpub=Date.now()}}catch(e){}}
loadCfg().then(reCfg);setInterval(loadCfg,18e5);setInterval(reCfg,6e5);

/* ---------- Synchronisation Supabase (compte cloud + sauvegarde automatique) ---------- */
const SB=supabaseClient,SYNC_T="boutique_data",CS={user:null,msg:""};let syncT=0,syncBusy=0,LASTJSON=JSON.stringify(db);
const dirty=()=>LS.rg_dirty==="1";
const _save=save;save=function(){_save();if(SB&&CS.user){let s=JSON.stringify(db);if(s!==LASTJSON){LS.rg_dirty="1";clearTimeout(syncT);syncT=setTimeout(()=>pushCloud(),3000)}}};
function cloudRefresh(){if(page==="settings"&&setTab==="cloud")render()}
async function pushCloud(force){if(!SB||!CS.user||syncBusy)return;syncBusy=1;try{
if(!force){let c=await SB.from(SYNC_T).select("updated_at").eq("owner",CS.user.id).maybeSingle();if(c.error)throw c.error;if(c.data&&c.data.updated_at!==LS.rg_sync_at){syncBusy=0;return pullCloud()}}
let s=JSON.stringify(db),r=await SB.from(SYNC_T).upsert({owner:CS.user.id,data:JSON.parse(s),updated_at:new Date().toISOString()}).select("updated_at").single();if(r.error)throw r.error;
LASTJSON=s;LS.rg_sync_at=r.data.updated_at;LS.rg_dirty="0";CS.msg="Synchronisé à "+new Date().toLocaleTimeString("fr-FR")}catch(e){CS.msg="Échec de la synchronisation : "+(e.message||e)}syncBusy=0;cloudRefresh()}
async function pullCloud(relogin){if(!SB||!CS.user||syncBusy)return;try{let r=await SB.from(SYNC_T).select("data,updated_at").eq("owner",CS.user.id).maybeSingle();if(r.error)throw r.error;
if(!r.data)return pushCloud(true);
if(r.data.updated_at===LS.rg_sync_at){if(dirty())return pushCloud();CS.msg="À jour ("+new Date().toLocaleTimeString("fr-FR")+")";return cloudRefresh()}
if(dirty()&&!confirm("Des modifications existent sur cet appareil ET dans le cloud.\n\nOK = garder les données du CLOUD (les changements de cet appareil seront perdus)\nAnnuler = envoyer les données de CET APPAREIL vers le cloud"))return pushCloud(true);
applyRemote(r.data.data||{},r.data.updated_at,relogin)}catch(e){CS.msg="Échec de la synchronisation : "+(e.message||e);cloudRefresh()}}
function applyRemote(d,at,relogin){db=normalize({...structuredClone(seed),...d,settings:{...seed.settings,...(d.settings||{})}});_save();LASTJSON=JSON.stringify(db);LS.rg_sync_at=at;LS.rg_dirty="0";CS.msg="Données du cloud chargées";applyBrand();
let lw=$("#lockWrap");if(relogin||(lw&&!lw.hidden))db.settings.setup?showLogin(false):showSetup();else if(!db.users.some(u=>u.id===uid))showLogin(false);else{applyPrefs();refreshChip();render()}}
function cloudSignIn(relogin){if(!SB)return toast("Connexion internet requise pour charger Supabase.");modal("Compte cloud",`<p class="hint">Utilisez le même email sur tous vos appareils : les données de la boutique seront synchronisées.</p>${inp("cEmail","Email","","email",'autocomplete="email"')}${inp("cPass","Mot de passe du compte cloud (6 caractères min.)","","password",'autocomplete="current-password"')}<button class="btn light" style="margin-top:10px;width:100%" onclick="cloudAuth('up',${!!relogin})">Créer un compte cloud</button>`,"Se connecter",()=>cloudAuth("in",!!relogin))}
async function cloudAuth(mode,relogin){let e=$("#cEmail").value.trim(),p=$("#cPass").value;if(!e||p.length<6)return toast("Email et mot de passe (6 caractères min.) requis.");
try{let r=mode==="up"?await SB.auth.signUp({email:e,password:p}):await SB.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;
if(!r.data.session)return toast("Compte créé : confirmez votre email, puis connectez-vous.");
CS.user=r.data.session.user;if(!LS.rg_sync_at&&db.settings.setup)LS.rg_dirty="1";closeModal();await pullCloud(relogin);cloudRefresh();toast("Compte cloud connecté.")}catch(x){toast("Échec : "+(x.message||x))}}
async function cloudOut(){if(!confirm("Se déconnecter du cloud ? Les données restent sur cet appareil mais ne seront plus synchronisées."))return;try{await SB.auth.signOut()}catch(e){}CS.user=null;delete LS.rg_sync_at;LS.rg_dirty="0";CS.msg="";render()}
TABS.cloud=()=>`<section class="setting-card wide" style="max-width:520px"><h3>☁ Synchronisation cloud</h3>${!SB?`<p class="hint">Bibliothèque Supabase non chargée : connexion internet requise.</p>`:CS.user?`<p><span class="pill">Connecté</span> ${esc(CS.user.email||"")}</p><p class="hint">${esc(CS.msg||"")}${dirty()?" · modifications en attente d'envoi":""}</p><div class="toolbar"><button class="btn primary" onclick="pullCloud()">↻ Synchroniser maintenant</button><button class="btn light" onclick="cloudOut()">Se déconnecter</button></div>`:`<p class="hint">Reliez cet appareil à un compte cloud pour sauvegarder vos données et les retrouver sur d'autres appareils.</p><button class="btn primary" onclick="cloudSignIn(false)">Se connecter / créer un compte cloud</button>`}</section>`;
async function initCloud(){if(!SB)return;try{let g=await SB.auth.getSession();CS.user=(g.data&&g.data.session&&g.data.session.user)||null;SB.auth.onAuthStateChange((_e,s)=>{CS.user=s?s.user:null});if(CS.user)await pullCloud()}catch(e){}cloudRefresh()}
initCloud();setInterval(()=>{if(CS.user)dirty()?pushCloud():pullCloud()},9e4);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CS.user&&!dirty())pullCloud()});addEventListener("online",()=>{if(CS.user)dirty()?pushCloud():pullCloud()});

/* ---------- Scan code-barres (html5-qrcode) ---------- */
let scanner=null, scanMode=null;
async function startScan(mode){
  scanMode=mode;
  let w=$("#scanWrap");
  if(!w){w=document.createElement("div");w.id="scanWrap";w.className="modal-wrap";w.style.zIndex="80";document.body.appendChild(w)}
  w.hidden=false;
  w.innerHTML=`<section class="modal" style="max-width:480px"><button class="close" onclick="stopScan()">×</button>
    <h2 style="margin:0 0 12px">📷 Scanner un code-barres</h2>
    <p class="hint" style="margin-bottom:12px">${mode==="pos"?"Pointez la caméra arrière vers le code-barres du produit.":"Scannez le code-barres à associer à ce produit."}</p>
    <div id="qr-reader" style="width:100%;border-radius:10px;overflow:hidden"></div>
    <p class="hint" id="scanStatus" style="margin-top:10px;text-align:center">Vérification de la caméra…</p>
    <div id="scanManual" style="display:none;margin-top:14px">
      <p class="hint" style="color:var(--red);margin-bottom:8px">Caméra inaccessible. Autorisez la caméra et ouvrez BoutiqueGest depuis une adresse HTTPS (pas directement depuis le gestionnaire de fichiers).</p>
      <div class="form-group"><label>Saisir le code-barres manuellement</label>
        <input id="manualBarcode" class="field" placeholder="Ex. 6123456789012" style="width:100%" inputmode="numeric">
      </div>
      <button class="btn primary" style="width:100%;margin-top:10px" onclick="manualBarcodeOk()">Valider le code</button>
    </div>
    <button class="btn light" style="width:100%;margin-top:12px" onclick="stopScan()">Annuler</button>
  </section>`;
  const status=$("#scanStatus"), reader=$("#qr-reader"), manual=$("#scanManual");
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent="Cette page n'a pas l'autorisation technique d'utiliser la caméra : ouvrez-la en HTTPS.";
    manual.style.display="block";reader.style.display="none";return;
  }
  if(typeof Html5Qrcode==="undefined"){
    status.textContent="Le module de lecture n'est pas chargé. Vérifiez la connexion Internet.";
    manual.style.display="block";reader.style.display="none";return;
  }
  try{
    const qr=new Html5Qrcode("qr-reader");
    scanner=qr;
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras || !cameras.length) throw new Error("Aucune caméra détectée");
    const back=cameras.find(c=>/back|rear|environment|arrière|environment/i.test(c.label||"")) || cameras[cameras.length-1];
    const config={fps:12,qrbox:(vw,vh)=>({width:Math.min(320,Math.floor(vw*.85)),height:Math.min(180,Math.floor(vh*.55))}),aspectRatio:1.777};
    if(typeof Html5QrcodeSupportedFormats!=="undefined") config.formatsToSupport=[
      Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.QR_CODE
    ];
    await qr.start(back.id,config,(decodedText)=>onScanSuccess(decodedText),()=>{});
    if($("#scanStatus"))$("#scanStatus").textContent="Caméra active — placez le code-barres dans le cadre.";
  }catch(err){
    console.warn("Erreur caméra BoutiqueGest:",err);
    if($("#scanStatus"))$("#scanStatus").textContent="Caméra non démarrée : "+(err&&err.message?err.message:"autorisation refusée");
    if($("#scanManual"))$("#scanManual").style.display="block";
    if($("#qr-reader"))$("#qr-reader").style.display="none";
    toast("Autorisez la caméra dans Chrome puis réessayez.");
  }
}
function manualBarcodeOk(){
  let code=($("#manualBarcode")?.value||"").trim();
  if(!code)return toast("Saisissez un code-barres.");
  onScanSuccess(code);
}
function onScanSuccess(code){
  if(!code)return;
  stopScan();
  code = String(code).trim();
  if(scanMode==="product"){
    let el=$("#pBarcode");
    if(el){el.value=code;toast("Code-barres capturé : "+code)}
    else toast("Champ code-barres introuvable.");
  }else if(scanMode==="pos"){
    let p=db.products.find(x=>(x.barcode||"")===code);
    if(p){
      addCart(p.id);
      toast(p.name+" ajouté au ticket");
      // Keep focus / re-render already done by addCart
    }else{
      // Offer to create
      if(confirm("Aucun produit avec le code « "+code+" ».\nCréer un nouveau produit ?")){
        // Pre-fill and open form
        openProduct();
        setTimeout(()=>{
          let b=$("#pBarcode");if(b)b.value=code;
          let n=$("#pName");if(n)n.focus();
        },200);
      }else{
        toast("Produit non trouvé.");
      }
    }
  }
  scanMode=null;
}
async function stopScan(){
  const active=scanner;scanner=null;
  if(active){
    try{if(active.isScanning)await active.stop();}catch(e){console.warn("Arrêt caméra:",e)}
    try{active.clear();}catch(e){}
  }
  let w=$("#scanWrap");if(w)w.hidden=true;
}


/* ---------- Mises à jour applicatives + push licence (partenaire) ---------- */
const UPD_TOPIC=()=>"rgupd-"+BILLING.topic;
async function publishUpdate(){
  if(!LS.rg_owner_priv)return toast("Réservé au propriétaire");
  const notes=($("#updNotes")&&$("#updNotes").value||"").trim()||("Nouvelle version "+APP_VERSION);
  const body=JSON.stringify({v:APP_VERSION,notes,t:Date.now()});
  try{
    const r=await fetch(`${BILLING.ntfy}/${UPD_TOPIC()}`,{method:"POST",headers:{Title:"Mise à jour BoutiqueGest "+APP_VERSION,Tags:"arrow_up,package",Priority:"high","Content-Type":"application/json"},body});
    if(!r.ok)throw 0;
    LS.rg_pub_ver=APP_VERSION;
    toast("✅ Notification de mise à jour envoyée aux partenaires");
  }catch(e){toast("Envoi impossible — vérifiez Internet")}
}
async function checkAppUpdate(){
  try{
    const r=await fetch(`${BILLING.ntfy}/${UPD_TOPIC()}/json?poll=1&since=all`,{cache:"no-store"});
    if(!r.ok)return;
    const raw=await r.text();
    const events=raw.trim().split(/\r?\n/).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    const msgs=events.filter(e=>e.event==="message").map(e=>{
      try{return {time:e.time,...JSON.parse(e.message)}}catch(err){
        return {time:e.time,v:null,notes:String(e.message||"")}
      }
    });
    if(!msgs.length)return;
    const last=msgs[msgs.length-1];
    const seen=LS.rg_seen_upd||"";
    const key=String(last.v||"")+"@"+String(last.time||"");
    if(key===seen)return;
    // Show if published version is different from local or notes present
    if(last.v && last.v!==APP_VERSION){
      LS.rg_seen_upd=key;
      showUpdateBanner(last.v,last.notes||"",last.url||"");
      bgNotify("BoutiqueGest - Mise à jour","Version "+last.v+" disponible. "+(last.notes||""),last.url||"","bg-upd");
    }
  }catch(e){}
}
function showUpdateBanner(ver,notes){
  let b=$("#updBar");
  if(!b){b=document.createElement("div");b.id="updBar";b.style.cssText="padding:10px 16px;background:#1a4a3a;color:#e8f5c8;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border-bottom:1px solid #2a6a52";document.body.insertBefore(b,document.body.firstChild)}
  b.hidden=false;
  b.innerHTML=`⬆ Mise à jour disponible (v${esc(ver)}) — ${esc(notes||"Nouvelle version")} · <u>Actualiser l'application</u>`;
  b.onclick=()=>{
    if(confirm("Recharger l'application pour appliquer la mise à jour ?\\n\\nAstuce : si vous utilisez l'APK/PWA, réinstallez ou tirez pour actualiser après publication de la nouvelle version.")){
      // Force SW update if any
      if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update()));
      location.reload(true);
    }
  };
}
// Partner: listen for remote license changes even when already Pro
async function pollLicPush(){
  if(LS.rg_owner_priv||document.hidden)return;
  try{
    const since=+(LS.rg_lic_poll_since||0);
    const response=await fetch(`${BILLING.ntfy}/rglic-${devId()}/json?poll=1&since=all`,{cache:"no-store"});
    if(!response.ok)return;
    const raw=await response.text();
    const events=raw.trim().split(/\r?\n/).filter(Boolean).map(line=>{try{return JSON.parse(line)}catch(e){return null}}).filter(Boolean);
    const msgs=events.filter(e=>e.event==="message"&&Number(e.time)>since);
    if(!msgs.length)return;
    const last=msgs[msgs.length-1];
    LS.rg_lic_poll_since=String(last.time);
    const body=String(last.message||"");
    if(body.startsWith("RG1.")){
      const L=await verifyLic(body.trim());
      if(L&&L.d===devId()&&L.e>=ymd(new Date())){
        const prev=LS.rg_lic;
        LS.rg_lic=body.trim();
        if(L.i)LS.rg_lic_start=L.i;
        delete LS.rg_pending;delete LS.rg_rej;
        await checkSub();render();
        if(prev!==LS.rg_lic){
          toast("✅ Abonnement mis à jour : actif jusqu'au "+L.e);
          try{if(Notification.permission==="granted")new Notification("BoutiqueGest",{body:"Abonnement modifié — expire le "+L.e})}catch(e){}
        }
      }
    }else if(body.startsWith("REJ:")){
      LS.rg_rej=body.slice(4);delete LS.rg_pending;await checkSub();render();
    }
  }catch(e){}
}

<script>

const BG_IDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('bg_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbPut(k,v){try{const d=await BG_IDB();await new Promise((a,b)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=a;t.onerror=b})}catch(e){}}
async function idbGet(k){try{const d=await BG_IDB();return await new Promise((a,b)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>a(q.result);q.onerror=b})}catch(e){return null}}

async function shrinkImg(f){if(!/^image\/(jpeg|png|webp|bmp)/.test(f.type))return f;try{const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));if(b&&b.size<f.size)return new File([b],(f.name.replace(/\.[^.]+$/,'')||'image')+'.jpg',{type:'image/jpeg'})}catch(e){}return f}

async function pullChat(dev){
 try{
  const r=await fetch(`${BILLING.ntfy}/${chatTopic(dev)}/json?poll=1&since=all`,{cache:'no-store'});
  if(!r.ok)return {msgs:chatStore(dev),added:0};
  const ev=(await r.text()).trim().split(/\r?\n/).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
  let local=chatStore(dev),known=new Set(local.map(m=>m.id)),added=0;
  for(const e of ev.filter(e=>e.event==='message')){
   const m=parseChatMsg(e.message);if(!m||known.has(e.id))continue;
   const o={id:e.id,time:e.time,from:m.from,name:m.name,text:m.text};
   if(e.attachment&&e.attachment.url){o.att={name:e.attachment.name,type:e.attachment.type||'',size:e.attachment.size||0,url:e.attachment.url,exp:e.attachment.expires||0};
    fetch(o.att.url).then(x=>x.ok?x.blob():null).then(b=>b&&idbPut(e.id,b)).catch(()=>{})}
   local.push(o);known.add(e.id);added++}
  local.sort((a,b)=>a.time-b.time);chatSave(dev,local);return {msgs:local,added}
 }catch(e){return {msgs:chatStore(dev),added:0}}
}
async function sendChat(dev,text,asOwner){

 if(!dev)return toast('Conversation introuvable.');
 const from=asOwner?'owner':'partner',name=asOwner?(curUser().name||'Propriétaire'):(db.settings.name||curUser().name||'Partenaire');
 const clean=(text||'(fichier)').replace(/\|/g,'/').replace(/[\r\n]+/g,' ');
 const title=(asOwner?'Message support - ':'Message partenaire - ')+ascii(name);
 try{
  let j;const topic=chatTopic(dev);
  if(file)j=await ntfyPost(topic,file,{title,message:`CHAT|${from}|${ascii(name)}|${ascii(clean)||'(fichier)'}`,filename:ascii(file.name)||'fichier',tags:'speech_balloon'},'PUT');
  else j=await ntfyPost(topic,`CHAT|${from}|${ascii(name)}|${clean}`,{title,tags:'speech_balloon'});
  j=j||{};const id=j.id||('local-'+Date.now());
  const o={id,time:j.time||Math.floor(Date.now()/1000),from,name,text:file&&!text?'':text};
  if(file){o.att={name:file.name,type:file.type,size:file.size,url:(j.attachment&&j.attachment.url)||'',exp:(j.attachment&&j.attachment.expires)||0};await idbPut(id,file)}
  let local=chatStore(dev);if(!local.some(m=>m.id===id)){local.push(o);chatSave(dev,local)}
  chatFileSel=null;setAtt();return true
 }catch(e){toast('Envoi impossible : '+(e.message||'vérifiez Internet'));return false}
}

<script>
/* ===== v2.3.5 : envoi fiable (ntfy), validation propriétaire, blocage des ventes à l'expiration, bouton langue ===== */
async function ntfyPost(topic,body,meta,method){try{return await ntfyPost1(topic,body,meta,method)}catch(e){if(e&&e.rate){await new Promise(r=>setTimeout(r,3500));return ntfyPost1(topic,body,meta,method)}throw e}}
async function ntfyPost1(topic,body,meta,method){
 meta=meta||{};method=method||'POST';
 const base=BILLING.ntfy+'/'+topic,A=v=>ascii(v),isBlob=typeof body!=='string';
 const T=(url,opt,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({signal:c.signal,cache:'no-store'},opt)).finally(()=>clearTimeout(t))};
 const parse=async r=>{if(r.ok)return await r.json().catch(()=>({}));let t='';try{t=(await r.json()).error||''}catch(e){}if(r.status===429)t="limite d'envois atteinte, réessayez dans quelques minutes";{const er=new Error(t||('HTTP '+r.status));er.rate=r.status===429;throw er}};
 const hdr=()=>{const h={};if(meta.title)h.Title=A(meta.title);if(meta.tags)h.Tags=meta.tags;if(meta.priority)h.Priority=meta.priority;if(meta.message)h['X-Message']=A(meta.message);if(meta.filename)h.Filename=A(meta.filename);return h};
 const qs=()=>{const q=new URLSearchParams();if(meta.title)q.set('title',A(meta.title));if(meta.tags)q.set('tags',meta.tags);if(meta.priority)q.set('priority',meta.priority);return q.toString()};
 const net=e=>e&&(e instanceof TypeError||e.name==='AbortError');
 let last=null;
 if(!isBlob){ /* requête simple (sans pré-vérification CORS) d'abord */
  try{return await parse(await T(base+'?'+qs(),{method:'POST',body},20000))}catch(e){if(!net(e))throw e;last=e}
 }
 try{return await parse(await T(base,{method,headers:hdr(),body},isBlob?60000:20000))}catch(e){if(!net(e))throw e;last=e}
 throw new Error(last&&last.name==='AbortError'?'délai dépassé, réseau trop lent':'connexion impossible, vérifiez Internet');
}
/* message de demande de paiement : chaque champ nettoyé, séparateurs " | " conservés */
function payMsg(nm,m,pl,me,ref){const a=ascii;return `Client: ${a(nm)} | Appareil: ${devId()} | Mois: ${m} | Montant: ${a(fm(pl[2]))} | Mode: ${a(me.name)} | Ref: ${a(ref||'-')}`}
/* lecture tolérante (anciens messages dont les | étaient devenus des /) */
function parseReqMsg(msg){const x=String(msg||'').replace(/\s+/g,' ').match(/Client:\s*(.*?)\s*[|\/]\s*Appareil:\s*([A-Z0-9]{10})\s*[|\/]\s*Mois:\s*(\d+)\s*[|\/]\s*Montant:\s*(.*?)\s*[|\/]\s*Mode:\s*(.*?)\s*[|\/]\s*Ref:\s*(.*)$/);return x?{name:x[1],dev:x[2],m:+x[3],amount:x[4],method:x[5],ref:x[6]}:null}
/* confirmation maison (confirm() est bloqué dans certaines applications Android) */
function askConfirm(title,html,okText){return new Promise(res=>{const w=document.createElement('div');w.className='modal-wrap';w.style.zIndex='99990';
 w.innerHTML=`<section class="modal" style="max-width:420px"><h2>${title}</h2><p style="font-size:14px;line-height:1.5">${html}</p><div class="modal-actions"><button class="btn light" id="acNo">Annuler</button><button class="btn primary" id="acYes">${okText||'OK'}</button></div></section>`;
 document.body.appendChild(w);const done=v=>{w.remove();res(v)};w.querySelector('#acNo').onclick=()=>done(false);w.querySelector('#acYes').onclick=()=>done(true)})}

<script>
/* ===== v2.3.6 : messagerie corrigée, accès propriétaire, traducteur intégré, mise à jour forcée ===== */
let CHATERR='';
const normDev=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const isOwnerMode=()=>!!LS.rg_owner_priv&&isOwnerUser();
const unreadMap=()=>{try{return JSON.parse(LS.rg_unread||'{}')}catch(e){return {}}};
const setUnread=o=>{LS.rg_unread=JSON.stringify(o)};
function ownerDevs(){const m={};try{JSON.parse(LS.rg_clients||'[]').forEach(c=>m[c.dev]=c.name)}catch(e){}
 (typeof REQS!=='undefined'&&REQS||[]).forEach(r=>{if(r.dev&&!m[r.dev])m[r.dev]=r.name});
 Object.keys(LS).filter(k=>k.indexOf('rg_chat_')===0).forEach(k=>{const d=k.slice(8);if(d.length===10&&!m[d]){const l=chatStore(d).filter(x=>x.from==='partner').pop();m[d]=l?l.name:d}});return m}
async function pullChat(dev){
 try{
  const r=await fetch(`${BILLING.ntfy}/${chatTopic(dev)}/json?poll=1&since=all`,{cache:'no-store'});
  if(!r.ok){CHATERR=r.status===429?'trop de requêtes, nouvel essai automatique':'serveur de messagerie indisponible (HTTP '+r.status+')';return {msgs:chatStore(dev),added:0}}
  CHATERR='';
  const ev=(await r.text()).trim().split(/\r?\n/).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
  let local=chatStore(dev),known=new Set(local.map(m=>m.id)),added=0;
  for(const e of ev.filter(e=>e.event==='message')){
   const m=parseChatMsg(e.message);if(!m||known.has(e.id))continue;
   const o={id:e.id,time:e.time,from:m.from,name:m.name,text:m.text};
   if(e.attachment&&e.attachment.url){o.att={name:e.attachment.name,type:e.attachment.type||'',size:e.attachment.size||0,url:e.attachment.url,exp:e.attachment.expires||0};
    fetch(o.att.url).then(x=>x.ok?x.blob():null).then(b=>b&&idbPut(e.id,b)).catch(()=>{})}
   local.push(o);known.add(e.id);added++}
  local.sort((a,b)=>a.time-b.time);chatSave(dev,local);return {msgs:local,added}
 }catch(e){CHATERR='connexion impossible, vérifiez Internet';return {msgs:chatStore(dev),added:0}}
}
async function refreshChatUI(){
 if(!chatDev)return;const box=$('#chatBox');if(!box)return;
 const {msgs}=await pullChat(chatDev),me=isOwnerMode()?'owner':'partner';
 const st=$('#chatStat');if(st)st.innerHTML=CHATERR?`<span style="color:var(--red)">⚠ ${esc(CHATERR)}</span>`:'<span style="color:var(--green)">● Connecté</span>';
 if(box.dataset.n===String(msgs.length))return;box.dataset.n=msgs.length;
 box.innerHTML=msgs.length?msgs.map(m=>{const mine=m.from===me;
  return `<div style="margin:6px 0;display:flex;justify-content:${mine?'flex-end':'flex-start'}"><div style="max-width:85%;padding:8px 10px;border-radius:12px;background:${mine?'#d7eb9c':'#fff'};color:#18231f;border:1px solid #e0e4dc;text-align:left"><div style="font-size:11px;opacity:.7;margin-bottom:2px">${esc(m.name||m.from)} · ${new Date(m.time*1000).toLocaleString(bgLoc())}</div>${m.text&&m.text!=='(fichier)'?`<div style="font-size:14px;white-space:pre-wrap">${esc(m.text)}</div>`:''}${attHtml(m)}</div></div>`}).join(''):`<p class="empty">Aucun message pour l'instant. Écrivez le premier.</p>`;
 box.scrollTop=box.scrollHeight;hydrateAtt(box)
}
function ownerPicker(){const m=ownerDevs(),un=unreadMap(),ids=Object.keys(m);
 modal('Choisir un partenaire',(ids.length?`<div class="table-wrap"><table class="data-table"><tr><th>Partenaire</th><th>Appareil</th><th></th></tr>${ids.map(d=>`<tr><td><b>${esc(m[d])}</b></td><td>${esc(d)}</td><td><button class="mini" onclick="closeModal();openChat('${esc(d)}')">💬 Ouvrir${un[d]?' ('+un[d]+')':''}</button></td></tr>`).join('')}</table></div>`:'<p class="hint">Aucun partenaire connu pour le moment.</p>')+`<div class="form-group" style="margin-top:12px"><label>Ou saisir un identifiant appareil</label><div style="display:flex;gap:8px"><input id="chatDevIn" class="field" placeholder="K7QM-9XD2-A4" autocapitalize="characters" style="flex:1"><button class="btn primary" onclick="openChat(document.getElementById('chatDevIn').value)">Ouvrir</button></div></div>`,'Fermer',closeModal)}
async function openChat(dev){
 const owner=isOwnerMode();
 if(!dev){if(owner)return ownerPicker();dev=devId()}
 dev=normDev(dev);if(dev.length!==10)return toast('Identifiant appareil invalide (10 caractères).');
 const un=unreadMap();if(un[dev]){delete un[dev];setUnread(un)}
 const nm=owner?(ownerDevs()[dev]||dev):'';
 modal(owner?`💬 Chat — ${esc(nm)}`:`💬 Support ${esc(BILLING.app)}`,`<div id="chatBox" style="max-height:320px;overflow:auto;background:#f4f6f3;color:#18231f;border-radius:10px;padding:10px;text-align:left;margin-bottom:10px"><p class="hint">Chargement…</p></div>
 <div id="chatAtt" class="hint" style="margin-bottom:6px"></div><div style="display:flex;gap:8px"><button class="btn light" type="button" onclick="document.getElementById('chatFile').click()" title="Joindre un fichier ou une image">📎</button><input type="file" id="chatFile" hidden onchange="pickChatFile(this)"><input id="chatInput" class="field" placeholder="Votre message…" style="flex:1" maxlength="500" onkeydown="if(event.key==='Enter'){event.preventDefault();submitChat()}"><button class="btn primary" onclick="submitChat()">Envoyer</button></div>
 <div id="chatStat" class="hint" style="margin-top:8px"></div><p class="hint" style="margin-top:4px">Fichiers et images : 5 Mo max. Actualisation automatique.</p>`,'Fermer',()=>{stopChatPoll();closeModal()});
 const ms=$('#modalSubmit');if(ms)ms.style.display='none';
 const cn=document.querySelector('#modal .modal-actions .btn.light');if(cn)cn.onclick=()=>{stopChatPoll();closeModal()};
 stopChatPoll();chatDev=dev;chatFileSel=null;   /* BUG corrigé : stopChatPoll() remettait chatDev à null après l'ouverture, l'envoi ne partait donc jamais */
 await refreshChatUI();
 chatPoll=setInterval(()=>{if(!document.hidden)refreshChatUI()},10000);
}
/* Propriétaire : nouveaux messages de tous les partenaires */
async function ownerChatPoll(){
 if(!isOwnerMode()||document.hidden)return;
 const devs=Object.keys(ownerDevs());if(!devs.length)return;
 for(let i=0;i<devs.length;i+=30){const part=devs.slice(i,i+30);
  try{const r=await fetch(`${BILLING.ntfy}/${part.map(chatTopic).join(',')}/json?poll=1&since=all`,{cache:'no-store'});if(!r.ok)continue;
   const evs=(await r.text()).trim().split(/\r?\n/).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(e=>e&&e.event==='message');
   let un=unreadMap(),n=0,who='';
   for(const e of evs){const dev=String(e.topic||'').replace('rgchat-',''),m=parseChatMsg(e.message);if(!m||m.from!=='partner'||dev.length!==10)continue;
    let local=chatStore(dev);if(local.some(x=>x.id===e.id))continue;
    const o={id:e.id,time:e.time,from:m.from,name:m.name,text:m.text};
    if(e.attachment&&e.attachment.url){o.att={name:e.attachment.name,type:e.attachment.type||'',size:e.attachment.size||0,url:e.attachment.url,exp:e.attachment.expires||0};fetch(o.att.url).then(x=>x.ok?x.blob():null).then(b=>b&&idbPut(e.id,b)).catch(()=>{})}
    local.push(o);local.sort((a,b)=>a.time-b.time);chatSave(dev,local);
    if(chatDev!==dev){un[dev]=(un[dev]||0)+1;n++;who=m.name}}
   if(n){setUnread(un);toast('💬 Nouveau message de '+who);bgNotify('BoutiqueGest - Messagerie',n+' nouveau(x) message(s) de '+who,'','bg-chat')}
  }catch(e){}}
}
setInterval(ownerChatPoll,30000);setTimeout(ownerChatPoll,4000);

/* ===== Traducteur intégré (sans widget Google, fonctionne dans les applications installées) ===== */
const TR={lang:null,cache:{},pending:new Set(),busy:false,obs:null,applying:false,timer:null};
const trKey=l=>'bg_tr_'+l;
function trSave(){try{const j=JSON.stringify(TR.cache);if(j.length<2.5e6)LS[trKey(TR.lang)]=j}catch(e){}}
const trWant=t=>t.length>1&&t.length<400&&/[A-Za-zÀ-ÿ]/.test(t);
async function trFetch(lines,tl){
 const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&dt=t&tl='+encodeURIComponent(tl)+'&q='+encodeURIComponent(lines.join('\n'));
 const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
 const d=await r.json();return (d[0]||[]).map(x=>x[0]||'').join('').split('\n')}
async function trPending(){
 if(TR.busy)return;TR.busy=true;
 try{while(TR.pending.size){
  const items=[...TR.pending].filter(t=>!(t in TR.cache));TR.pending.clear();
  const batches=[];let b=[],len=0;for(const t of items){if(len+t.length>700&&b.length){batches.push(b);b=[];len=0}b.push(t);len+=t.length+1}if(b.length)batches.push(b);
  for(let i=0;i<batches.length;i+=3){
   await Promise.all(batches.slice(i,i+3).map(async bt=>{
    try{const res=await trFetch(bt,TR.lang);
     if(res.length===bt.length)bt.forEach((t,k)=>TR.cache[t]=(res[k]||'').trim()||t);
     else for(const t of bt){try{TR.cache[t]=(await trFetch([t],TR.lang)).join(' ').trim()||t}catch(e){}}
    }catch(e){}}));
   trSave();trScan()}
 }}finally{TR.busy=false}
}
function trScan(){
 if(!TR.lang||TR.lang==='fr'||!document.body)return;
 TR.applying=true;
 try{
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;return(!p||p.closest('.notranslate,[translate="no"],script,style,textarea'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const raw=n.nodeValue;if(n.__tr===raw)continue;const key=raw.replace(/\s+/g,' ').trim();if(!trWant(key))continue;
   if(key in TR.cache){const t=TR.cache[key];if(t&&t!==key){const p=n.parentElement;if(p&&p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',key);
     const nv=raw.match(/^\s*/)[0]+t+raw.match(/\s*$/)[0];n.nodeValue=nv;n.__tr=nv}}
   else TR.pending.add(key)}
  document.querySelectorAll('[placeholder]:not(.notranslate)').forEach(el=>{const v=el.getAttribute('placeholder');if(el.__trp===v)return;const k=(v||'').trim();if(!trWant(k))return;
   if(k in TR.cache){const t=TR.cache[k];if(t){el.setAttribute('placeholder',t);el.__trp=t}}else TR.pending.add(k)});
 }catch(e){}
 TR.applying=false;if(TR.obs)TR.obs.takeRecords();
 if(TR.pending.size)trPending();
}
function trStart(l){
 TR.lang=l;try{TR.cache=JSON.parse(LS[trKey(l)]||'{}')}catch(e){TR.cache={}}
 document.documentElement.dir=BG_RTL.includes(l)?'rtl':'ltr';
 TR.obs=new MutationObserver(()=>{if(TR.applying)return;clearTimeout(TR.timer);TR.timer=setTimeout(trScan,150)});
 TR.obs.observe(document.body,{childList:true,subtree:true,characterData:true});trScan()}
async function setLang(c){
 closeLang();
 if(c==='fr'){LS.bg_lang='fr';LS.bg_loc='fr';delete LS.bg_trmode;const x='googtrans=;path=/;expires=Thu, 01 Jan 1970 00:00:00 GMT';document.cookie=x;document.cookie=x+';domain='+location.hostname;location.reload();return}
 toast('Langue / Language …');
 let mode='own';try{await trFetch(['Bonjour'],c)}catch(e){mode='gt'}
 LS.bg_lang=c;LS.bg_loc=({iw:'he',jw:'jv'})[c]||c;LS.bg_trmode=mode;location.reload()}
if(LS.bg_lang&&LS.bg_lang!=='fr'&&LS.bg_trmode!=='gt'){const go=()=>trStart(LS.bg_lang);document.readyState==='loading'?document.addEventListener('DOMContentLoaded',go):setTimeout(go,50)}
/* Bouton langue accessible aussi sur les écrans de verrouillage / expiration */
(function(){const b=document.createElement('button');b.id='lockLang';b.className='notranslate';b.textContent='🌐';b.setAttribute('aria-label','Langue');b.onclick=openLang;
 b.style.cssText='position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:100001;width:42px;height:42px;border-radius:50%;border:0;background:#c8df75;color:#102a25;font-size:20px;display:none';document.body.appendChild(b);
 setInterval(()=>{const a=document.getElementById('lockWrap'),p=document.getElementById('payWrap');b.style.display=((a&&!a.hidden)||(p&&!p.hidden))&&!document.getElementById('langOv')?'block':'none'},400)})();
/* Mise à jour forcée : si une version plus récente est en ligne, on vide le cache et on recharge */
async function bgSelfUpdate(){try{if(location.protocol==='file:')return;const r=await fetch(location.pathname+(location.search||''),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=t.match(/const APP_VERSION="([^"]+)"/);
 if(!m||m[1]===APP_VERSION||LS.rg_upd_try===m[1])return;LS.rg_upd_try=m[1];
 if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()))}
 if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.reload()}catch(e){}}
setTimeout(bgSelfUpdate,3000);
</script>
<script>
/* v2.3.7 : sauvegarde / transfert de la clé propriétaire */
function exportOwnerKey(){if(!LS.rg_owner_priv)return toast('Aucune clé sur cet appareil.');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([LS.rg_owner_priv],{type:'application/json'}));a.download='CLE_PRIVEE_PROPRIETAIRE.json';document.body.appendChild(a);a.click();a.remove();toast('Clé téléchargée. Gardez-la en lieu sûr.')}
function copyOwnerKey(){if(!LS.rg_owner_priv)return toast('Aucune clé sur cet appareil.');navigator.clipboard.writeText(LS.rg_owner_priv).then(()=>toast('Clé copiée. Collez-la dans « Accès propriétaire » sur l\'autre appareil.')).catch(()=>toast('Copie impossible : utilisez le téléchargement.'))}
function showOwnerKey(){const t=document.getElementById('ownKeyTxt');if(!t)return;t.hidden=false;t.value=LS.rg_owner_priv||'';t.focus();t.select();try{t.setSelectionRange(0,99999)}catch(e){}toast('Clé affichée : appuyez longuement dans la zone, puis « Tout sélectionner » et « Copier ».')}
function shareOwnerKey(){if(!LS.rg_owner_priv)return toast('Aucune clé sur cet appareil.');if(navigator.share)navigator.share({title:'Clé propriétaire',text:LS.rg_owner_priv}).catch(()=>{});else showOwnerKey()}
function keyCard(){return `<section class="setting-card wide"><h3>🔐 Sauvegarde de ma clé propriétaire</h3><p class="hint">Cette clé permet de valider les abonnements. Elle n'existe que sur les appareils où vous l'avez importée. Pour l'importer sur un autre appareil : Paramètres > Abonnement > Accès propriétaire. Ne la donnez jamais à un partenaire.</p><div class="toolbar" style="flex-wrap:wrap;gap:8px"><button class="btn primary" onclick="showOwnerKey()">👁 Afficher la clé</button><button class="btn light" onclick="copyOwnerKey()">Copier</button><button class="btn light" onclick="shareOwnerKey()">Partager (WhatsApp, e-mail…)</button><button class="btn light" onclick="exportOwnerKey()">⇩ Télécharger</button></div><textarea id="ownKeyTxt" class="code" rows="6" readonly hidden style="margin-top:10px;width:100%" onclick="this.select()"></textarea><p class="hint">Astuce : « Partager » puis envoyez-vous la clé à vous-même (messagerie personnelle), collez-la ensuite dans « Accès propriétaire » de l'application installée.</p></section>`}
{const o=TABS.own;TABS.own=function(){return o.apply(this,arguments)+keyCard()}}
</script>
<script>
/* ===== v2.4.0 : annuaire des comptes partenaires (visible par le propriétaire) ===== */
const REG_TOPIC=()=>'rgreg-'+BILLING.topic;
function regSig(){try{return JSON.stringify([db.settings.name,(db.users||[]).map(u=>[u.name,u.role]),SUB&&SUB.s,SUB&&SUB.exp,APP_VERSION])}catch(e){return ''}}
async function announce(force){
 try{
  if(LS.rg_owner_priv||!db.settings.setup)return;
  if(!force&&Date.now()-(+LS.rg_ann_t||0)<3*36e5)return;
  if(!LS.rg_first)LS.rg_first=String(Date.now());
  const o={k:'REG',dev:devId(),shop:ascii(db.settings.name||'').slice(0,50),users:(db.users||[]).slice(0,12).map(u=>({n:ascii(u.name||'').slice(0,30),r:u.role})),s:(SUB&&SUB.s)||'',e:(SUB&&SUB.exp)||'',d:(SUB&&SUB.days)||0,v:APP_VERSION,c:+LS.rg_first};
  await ntfyPost(REG_TOPIC(),JSON.stringify(o),{title:'Compte partenaire - '+(o.shop||o.dev),tags:'bust_in_silhouette'});
  LS.rg_ann_t=String(Date.now());LS.rg_ann_sig=regSig();
 }catch(e){}
}
setTimeout(()=>announce(true),6000);setInterval(()=>announce(),6e5);
setInterval(()=>{if(LS.rg_ann_sig!==regSig()&&!document.hidden)announce(true)},20000);

const partnersMap=()=>{try{return JSON.parse(LS.rg_partners||'{}')}catch(e){return {}}};
async function partnersPoll(manual){
 if(!isOwnerMode())return;
 try{
  const r=await fetch(`${BILLING.ntfy}/${REG_TOPIC()}/json?poll=1&since=all`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const m=partnersMap(),had=Object.keys(m).length;let ch=0,fresh=[];
  (await r.text()).trim().split(/\r?\n/).filter(Boolean).forEach(l=>{try{const e=JSON.parse(l);if(e.event!=='message')return;const o=JSON.parse(e.message);if(o.k!=='REG'||!/^[A-Z0-9]{10}$/.test(o.dev))return;
   const p=m[o.dev];if(!p||e.time>p.seen){if(!p)fresh.push(o.shop||o.dev);m[o.dev]=Object.assign({},o,{seen:e.time});ch++}}catch(x){}});
  LS.rg_partners=JSON.stringify(m);
  if(had&&fresh.length)toast('🆕 Nouveau partenaire : '+fresh[0]+(fresh.length>1?' (+'+(fresh.length-1)+')':''));
  if(manual)toast(ch?ch+' compte(s) mis à jour.':'Liste déjà à jour.');
  const a=document.activeElement;if(ch&&page==='settings'&&setTab==='own'&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();
 }catch(e){if(manual)toast('Actualisation impossible : '+(e.message||'réseau'))}
}
setInterval(()=>{if(!document.hidden)partnersPoll()},30000);setTimeout(partnersPoll,3000);

function ownerDevs(){const m={};try{JSON.parse(LS.rg_clients||'[]').forEach(c=>m[c.dev]=c.name)}catch(e){}
 Object.values(partnersMap()).forEach(p=>{if(!m[p.dev])m[p.dev]=p.shop||p.dev});
 (typeof REQS!=='undefined'&&REQS||[]).forEach(r=>{if(r.dev&&!m[r.dev])m[r.dev]=r.name});
 Object.keys(LS).filter(k=>k.indexOf('rg_chat_')===0).forEach(k=>{const d=k.slice(8);if(d.length===10&&!m[d]){const l=chatStore(d).filter(x=>x.from==='partner').pop();m[d]=l?l.name:d}});return m}
function fillLicDev(dev){const p=partnersMap()[dev]||{};const n=document.getElementById('lcName'),d=document.getElementById('lcDev');if(n)n.value=p.shop||dev;if(d)d.value=dev;window.scrollTo(0,0);toast('Appareil sélectionné : choisissez la durée puis générez.')}
function partnerStatus(p){if(p.s==='pro'){const ok=p.e&&p.e>=ymd(new Date());return ok?`<span class="badge" style="background:#d7eb9c;color:#18231f">Pro jusqu'au ${esc(p.e)}</span>`:`<span class="badge" style="background:#f6c9c9;color:#7a1f1f">Expiré (${esc(p.e)})</span>`}
 if(p.s==='trial')return `<span class="badge" style="background:#ffe9b0;color:#5a4300">Essai (${+p.d||0} j)</span>`;
 if(p.s==='expired')return `<span class="badge" style="background:#f6c9c9;color:#7a1f1f">Expiré</span>`;return esc(p.s||'—')}
function partnersCard(){const m=partnersMap(),un=unreadMap(),list=Object.values(m).sort((a,b)=>b.seen-a.seen);
 const rows=list.map(p=>`<tr><td><b>${esc(p.shop||'—')}</b><div class="hint" style="font-size:11px">${esc(p.dev)} · v${esc(p.v||'?')}</div></td><td style="font-size:12px">${(p.users||[]).map(u=>esc(u.n)+' <span class="hint">('+esc((ROLES[u.r]||{}).label||u.r)+')</span>').join('<br>')}</td><td>${partnerStatus(p)}</td><td style="font-size:12px">${new Date(p.seen*1000).toLocaleString(bgLoc())}<br><span class="hint">Créé le ${p.c?new Date(p.c).toLocaleDateString(bgLoc()):'—'}</span></td><td style="white-space:nowrap"><button class="mini" onclick="openChat('${esc(p.dev)}')">💬${un[p.dev]?' ('+un[p.dev]+')':''}</button> <button class="mini" onclick="fillLicDev('${esc(p.dev)}')">✓ Abonnement</button></td></tr>`).join('');
 return `<section class="setting-card wide"><div class="panel-head"><h3>👥 Comptes partenaires (${list.length})</h3><button class="btn light" onclick="partnersPoll(true)">↻ Actualiser</button></div><div class="table-wrap"><table class="data-table"><tr><th>Boutique</th><th>Comptes utilisateurs</th><th>Abonnement</th><th>Dernière connexion</th><th></th></tr>${rows||'<tr><td colspan="5" class="empty">Aucun compte reçu pour le moment.</td></tr>'}</table></div><p class="hint">Un partenaire apparaît dès qu'il ouvre l'application mise à jour avec Internet (et à chaque modification de ses comptes). La liste est conservée sur cet appareil.</p></section>`}
{const o=TABS.own;TABS.own=function(){return partnersCard()+o.apply(this,arguments)}}
</script>
